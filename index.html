<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站 - 核心资源</title>
    <style>
        :root {
            --primary-color: #00f2ff; /* 科技蓝 */
            --accent-color: #7000ff;  /* 幻影紫 */
            --bg-dark: #0a0b1e;       /* 深空底色 */
            --text-main: #e0e0e0;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            padding: 40px 20px;
        }

        /* 玻璃质感容器 */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 科技感头部 */
        .header {
            background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .header p {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.8;
            font-family: monospace;
        }

        /* 文件列表样式 */
        .file-list {
            list-style: none;
            padding: 10px;
            margin: 0;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.03);
            margin: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid transparent;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
            border-left: 4px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .file-name {
            font-weight: 500;
            font-size: 16px;
            display: flex;
            align-items: center;
            color: #fff;
        }

        /* 科技感图标 */
        .file-name::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            margin-right: 15px;
            border-radius: 2px;
            box-shadow: 0 0 8px var(--primary-color);
        }

        /* 霓虹下载按钮 */
        .download-btn {
            background: transparent;
            color: var(--primary-color);
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid var(--primary-color);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .download-btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 15px var(--primary-color);
        }

        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .download-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>青莲剑客下载站</h1>
            <p>CORE_DATA_REPOSITORY // SYSTEM_V3.0</p>
        </div>
        <ul class="file-list" id="fileList">
            <!-- 列表内容将通过 JavaScript 自动生成 -->
        </ul>
        <div class="footer">
            CONNECTED TO CLOUD SERVER. ENCRYPTED ACCESS.
        </div>
    </div>

    <script>
        // ==========================================
        //  配置区域：保持原有内容及链接不变
        // ==========================================
        const files = [
           //
            { name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", link: "https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "OpenSpeedy", link: "https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" },
        ];
        // ==========================================

        const listContainer = document.getElementById('fileList');

        files.forEach((file, index) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            // 延迟动画效果
            li.style.animation = `fadeIn 0.5s ease-out ${index * 0.1}s backwards`;
            
            li.innerHTML = `
                <div class="file-name">${file.name}</div>
                <a href="${file.link}" class="download-btn" target="_blank" download>DOWNLOAD</a>
            `;
            listContainer.appendChild(li);
        });
    </script>
</body>
</html>
