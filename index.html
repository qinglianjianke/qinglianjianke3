<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站</title>
    <style>
        :root {
            --jade: #00ffa3;     /* 核心翡翠绿 */
            --cyan: #00f2ff;     /* 电光青 */
            --purple: #7000ff;   /* 幻影紫 */
            --pink: #ff85a1;     /* 莲花粉 */
            --bg-deep: #02040a;  /* 深空底色 */
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 1. 幻彩量子画布 - 解决色彩空洞与单一 */
        #vibrant-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            /* 多色弥散背景光 */
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 163, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(112, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 40%, #06152a 0%, #02040a 100%);
        }

        /* 2. 顶部 Logo 星旋区域 */
        .header {
            width: 100%;
            padding: calc(50px + env(safe-area-inset-top)) 0 30px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 10;
        }

        .logo-frame {
            position: relative;
            width: 130px; height: 130px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px;
        }

        .main-sword {
            width: 80px; height: 80px;
            filter: drop-shadow(0 0 15px var(--jade));
            z-index: 5;
            animation: swordFloat 4s ease-in-out infinite;
        }

        @keyframes swordFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .header h1 {
            font-size: 28px; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(to bottom, #fff, var(--jade));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0; text-shadow: 0 0 20px rgba(0,255,163,0.3);
        }

        /* 3. 资源卡片列表 */
        .container {
            width: 100%; max-width: 500px;
            padding: 0 18px 80px;
            box-sizing: border-box;
            z-index: 5;
        }

        .file-card {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 25px;
            border-radius: 25px;
            padding: 35px 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        /* 幻彩全光谱扫边：解决“不够亮” */
        .file-card::before {
            content: ""; position: absolute; inset: -1px; border-radius: 25px;
            padding: 1.5px;
            background: linear-gradient(135deg, var(--jade), var(--purple), var(--pink), var(--cyan), var(--jade));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            background-size: 300% 300%;
            animation: borderFlow 6s linear infinite;
        }
        @keyframes borderFlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

        .title-group {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px; width: 100%;
        }

        .mini-sword {
            width: 30px; height: 30px; margin-right: 12px;
            filter: drop-shadow(0 0 8px var(--jade));
        }

        .file-name {
            font-size: 19px; font-weight: 700; color: #f5f5f5;
            letter-spacing: 0.5px;
        }

        /* 4. 翡翠核心按钮 */
        .download-btn {
            width: 85%; height: 55px;
            background: linear-gradient(90deg, #008f5d, var(--jade));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: #fff;
            font-weight: 900; font-size: 15px; letter-spacing: 3px;
            border: none; position: relative; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 255, 163, 0.3);
            transition: 0.3s;
        }
        .download-btn::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: scan 3s infinite;
        }
        @keyframes scan { 0% { left: -100%; } 40%, 100% { left: 100%; } }
        .download-btn:active { transform: scale(0.94); brightness: 1.2; }

        /* 微信专供 */
        #wechat-nav {
            display: none; width: 90%; max-width: 500px; margin: 15px 0 25px;
            background: linear-gradient(90deg, #008f5d, var(--jade));
            border: none; color: white; padding: 16px; border-radius: 12px;
            font-weight: bold; font-size: 14px; text-align: center;
            box-shadow: 0 5px 20px rgba(0, 255, 163, 0.3);
        }

        #wechat-guide {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.94); z-index: 9999; backdrop-filter: blur(15px);
        }

        .footer { padding: 40px; text-align: center; font-size: 10px; color: var(--jade); opacity: 0.4; letter-spacing: 5px; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <canvas id="vibrant-canvas"></canvas>

    <header class="header">
        <div class="logo-frame" id="mainLogo"></div>
        <h1>青莲剑客下载站</h1>
    </header>

    <div id="wechat-nav" onclick="copyLink()">🚀 网址已复制，点此去浏览器打开下载</div>

    <div id="wechat-guide" onclick="this.style.display='none'">
        <div style="position: absolute; top: 20px; right: 30px; color: var(--jade); text-align: right;">
            <div style="font-size: 50px; animation: bounce 1s infinite;">↗</div>
            <div style="color:#fff; margin-top: 15px; font-weight: bold;">微信环境受限<br>请点击右上角三个点<br>选择“在浏览器打开”</div>
        </div>
    </div>

    <main class="container" id="fileList"></main>

    <div class="footer">STATION_V10.0 // MULTI_SPECTRUM_CORE</div>

    <script>
        // 翡翠幻彩青莲剑 SVG
        const swordSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#00ffa3"/><stop offset="100%" stop-color="#00f2ff"/></linearGradient></defs>
            <path d="M50 5 L58 35 L54 75 L46 75 L42 35 Z" fill="url(#g)"/>
            <!-- 莲花剑格 (体现粉白青莲细节) -->
            <path d="M50 68 Q58 58 64 68 Q64 78 50 75 Q36 78 36 68 Q42 58 50 68" fill="#fff"/>
            <path d="M40 68 Q30 65 35 78 Q42 85 50 78" fill="#ff85a1"/>
            <path d="M60 68 Q70 65 65 78 Q58 85 50 78" fill="#ff85a1"/>
            <rect x="47" y="78" width="6" height="15" rx="3" fill="#fff"/>
        </svg>`;

        // 1. 幻彩粒子引擎 - 多色交织且不闪烁
        const canvas = document.getElementById('vibrant-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            // 数量提升，色彩丰富
            for (let i = 0; i < 130; i++) particles.push(new Particle(false));
            for (let i = 0; i < 80; i++) particles.push(new Particle(true));
        }

        class Particle {
            constructor(isOrbit) {
                this.isOrbit = isOrbit;
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.5;
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 50 + 60;
                this.speed = Math.random() * 0.012 + 0.005;
                this.vx = (Math.random() - 0.5) * 0.35;
                this.vy = (Math.random() - 0.5) * 0.35;
                // 色彩库：翡翠绿为主，带入蓝、紫、粉
                const palette = ['#00ffa3', '#00ffa3', '#00f2ff', '#7000ff', '#ff85a1'];
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }
            update() {
                if(this.isOrbit) {
                    this.angle += this.speed;
                    this.x = canvas.width / 2 + Math.cos(this.angle) * this.radius;
                    this.y = 120 + Math.sin(this.angle) * this.radius; 
                } else {
                    this.x += this.vx; this.y += this.vy;
                    if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.25;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init(); animate();

        // 2. 渲染内容
        document.getElementById('mainLogo').innerHTML = `<div class="main-sword">${swordSVG}</div>`;

        const files = [
            //{ name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料包", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy 工具", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" },
            { name: "STM32Environment", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32Environment/Environment.of.STM32.zip" },
            { name: "Proxy for windows or android", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/Clash/Proxy.for.windows.or.android.zip" },
            { name: "Cloudflare warp for Windows", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/CloudflareWarp/Cloudflare.for.windows.zip" },
        ];

        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        if(isWechat) document.getElementById('wechat-nav').style.display = 'block';

        const listEl = document.getElementById('fileList');
        files.forEach(file => {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `
                <div class="title-group">
                    <div class="mini-sword">${swordSVG}</div>
                    <div class="file-name">${file.name}</div>
                </div>
                <a href="${file.link}" class="download-btn" onclick="handleDl(event)">DOWNLOAD</a>
            `;
            listEl.appendChild(card);
        });

        function handleDl(e) {
            if (isWechat) {
                e.preventDefault();
                document.getElementById('wechat-guide').style.display = 'block';
            }
        }

        function copyLink() {
            const t = document.createElement("input");
            t.value = window.location.href;
            document.body.appendChild(t); t.select();
            document.execCommand("copy"); document.body.removeChild(t);
            alert("✅ 站点网址已复制！请粘贴到浏览器打开。");
        }
    </script>
</body>
</html>
