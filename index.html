<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站 - 核心资源</title>
    <style>
        :root {
            --cyan: #00f2ff;
            --blue: #0062ff;
            --bg-dark: #070914;
            --glass: rgba(255, 255, 255, 0.05);
        }

        /* 动态极光背景 */
        body {
            margin: 0; padding: 30px 15px;
            background: var(--bg-dark);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            /* 背景装饰：填补两边空洞 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 98, 255, 0.15) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
        }

        /* 微信专供按钮 */
        #wechat-nav {
            display: none; width: 100%; max-width: 600px;
            margin-bottom: 25px;
            animation: slideDown 0.4s ease;
        }
        .share-btn {
            width: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan));
            border: none; color: white; padding: 16px; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer;
            box-shadow: 0 5px 25px rgba(0, 242, 255, 0.3);
            letter-spacing: 1px;
        }

        /* 全息透明容器 */
        .container {
            width: 100%; max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            position: relative;
        }

        /* 顶部科技条 */
        .container::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        }

        .header {
            padding: 50px 20px 30px; text-align: center;
        }
        .header h1 {
            margin: 0; font-size: 26px; font-weight: 800;
            letter-spacing: 4px; color: #fff;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }
        .header p { 
            margin: 12px 0 0; font-size: 10px; font-family: monospace; 
            color: var(--cyan); letter-spacing: 5px; opacity: 0.8;
        }

        .file-list { padding: 10px; list-style: none; margin: 0; }
        
        /* 统一的文件列表项 */
        .file-item {
            background: rgba(255, 255, 255, 0.02); margin: 10px;
            padding: 20px 24px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }
        .file-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 242, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .file-info { display: flex; align-items: center; }
        
        /* 统一的高级几何图标 */
        .file-icon-box {
            width: 10px; height: 10px; 
            background: var(--cyan);
            margin-right: 20px;
            transform: rotate(45deg); /* 菱形造型 */
            box-shadow: 0 0 10px var(--cyan);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; box-shadow: 0 0 5px var(--cyan); }
            50% { opacity: 1; box-shadow: 0 0 15px var(--cyan); }
            100% { opacity: 0.5; box-shadow: 0 0 5px var(--cyan); }
        }

        .file-name { font-size: 15px; font-weight: 500; color: #e0e0e0; letter-spacing: 0.5px; }

        /* 纯色高级感按钮 */
        .download-btn {
            background: transparent;
            color: var(--cyan); 
            padding: 8px 22px; 
            border-radius: 8px;
            font-size: 12px; font-weight: 700; text-decoration: none;
            border: 1px solid var(--cyan);
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .download-btn:hover { 
            background: var(--cyan); 
            color: #000; 
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        /* 微信引导弹窗 */
        #guide-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 1000; backdrop-filter: blur(15px);
            justify-content: center; align-items: center;
        }
        .guide-box {
            width: 80%; max-width: 350px; background: #0f1225; border: 1px solid var(--cyan);
            border-radius: 24px; padding: 40px 20px; text-align: center; position: relative;
        }
        .guide-arrow { position: absolute; top: -45px; right: 20px; font-size: 40px; color: var(--cyan); animation: bounce 1s infinite; }

        .footer { padding: 30px; text-align: center; font-size: 9px; color: rgba(255,255,255,0.2); font-family: monospace; letter-spacing: 4px; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        @media (max-width: 600px) {
            .file-item { flex-direction: column; text-align: center; gap: 18px; padding: 25px; }
            .download-btn { width: 100%; }
            .file-icon-box { margin-right: 0; margin-bottom: 12px; }
        }
    </style>
</head>
<body>

    <!-- 微信动作按钮 -->
    <div id="wechat-nav">
        <button class="share-btn" onclick="copyStationLink()">🚀 网址已复制，点此去浏览器打开下载</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>青莲剑客下载站</h1>
            <p>QUANTUM_CORE // DATA_V5.1</p>
        </div>

        <ul class="file-list" id="fileList">
            <!-- 自动生成内容 -->
        </ul>

        <div class="footer">
            CONNECTED // STABLE_STRENGTH_100%
        </div>
    </div>

    <!-- 微信引导 -->
    <div id="guide-overlay" onclick="this.style.display='none'">
        <div class="guide-box">
            <div class="guide-arrow">↗</div>
            <h2 style="color: #fff; font-size: 18px; margin-bottom: 10px;">微信环境下载受限</h2>
            <p style="color: #888; font-size: 13px; line-height: 1.8;">
                请点击右上角 <strong style="color:var(--cyan)">三个点</strong><br>
                选择 <strong style="color:var(--cyan)">在浏览器打开</strong><br>
                即可直接开始高速下载
            </p>
            <button style="margin-top: 20px; background: var(--cyan); border: none; padding: 10px 30px; border-radius: 8px; font-weight: bold; cursor: pointer;">确定</button>
        </div>
    </div>

    <script>
        const files = [
            { name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" },
        ];

        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        if (isWechat) {
            document.getElementById('wechat-nav').style.display = 'block';
        }

        const listContainer = document.getElementById('fileList');

        files.forEach((file, index) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.style.animation = `slideDown 0.4s ease-out ${index * 0.1}s backwards`;
            
            li.innerHTML = `
                <div class="file-info">
                    <div class="file-icon-box"></div>
                    <div class="file-name">${file.name}</div>
                </div>
                <a href="${file.link}" class="download-btn" onclick="handleDownload(event)">Download</a>
            `;
            listContainer.appendChild(li);
        });

        function handleDownload(event) {
            if (isWechat) {
                event.preventDefault();
                document.getElementById('guide-overlay').style.display = 'flex';
            }
        }

        function copyStationLink() {
            const tempInput = document.createElement("input");
            tempInput.value = window.location.href;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("🚀 站点网址已成功复制！\n请打开手机浏览器（如 Safari 或 Chrome）粘贴访问。");
        }
    </script>
</body>
</html>
