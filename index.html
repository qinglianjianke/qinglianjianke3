<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站</title>
    <style>
        :root {
            --blue: #2a2eff;    /* 浓郁深蓝 */
            --purple: #8a2be2;  /* 极光紫 */
            --cyan: #00f2ff;    /* 霓虹青 */
            --bg-dark: #030512; /* 深夜底色 */
        }

        /* 动态浓郁色彩背景 */
        body {
            margin: 0; padding: 30px 15px;
            background: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            /* 背景装饰：填补两边空洞，色彩更蓝更紫 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(42, 46, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.25) 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* 微信专供：浓郁渐变按钮 */
        #wechat-nav {
            display: none; width: 100%; max-width: 620px;
            margin-bottom: 25px;
            animation: slideDown 0.4s ease;
        }
        .share-btn {
            width: 100%; background: linear-gradient(90deg, var(--blue), var(--purple));
            border: none; color: white; padding: 18px; border-radius: 15px;
            font-weight: 800; font-size: 15px; cursor: pointer;
            box-shadow: 0 5px 25px rgba(138, 43, 226, 0.4);
            letter-spacing: 1px;
        }

        /* 深色磨砂容器 */
        .container {
            width: 100%; max-width: 620px;
            background: rgba(10, 12, 30, 0.6);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 35px; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
            position: relative;
        }

        /* 顶部蓝紫流光条 */
        .container::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--blue), var(--purple), var(--cyan));
        }

        .header {
            padding: 50px 20px 35px; text-align: center;
        }
        .header h1 {
            margin: 0; font-size: 28px; font-weight: 800;
            letter-spacing: 4px; color: #fff;
            background: linear-gradient(to bottom, #fff, #b9beff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { 
            margin: 12px 0 0; font-size: 10px; font-family: monospace; 
            color: var(--purple); letter-spacing: 5px; font-weight: bold;
        }

        .file-list { padding: 10px; list-style: none; margin: 0; }
        
        .file-item {
            background: rgba(255, 255, 255, 0.02); margin: 12px;
            padding: 22px 26px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .file-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--blue);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* 修正图标对齐的容器 */
        .file-info { display: flex; align-items: center; justify-content: center; }
        
        /* 统一菱形图标：修正手机偏移 */
        .file-icon-box {
            width: 10px; height: 10px; 
            background: var(--blue);
            margin-right: 20px;
            flex-shrink: 0; /* 防止手机端被挤压 */
            transform: rotate(45deg);
            box-shadow: 0 0 15px var(--blue);
            animation: pulseColor 3s infinite;
        }
        @keyframes pulseColor {
            0%, 100% { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
            50% { background: var(--purple); box-shadow: 0 0 20px var(--purple); }
        }

        .file-name { font-size: 16px; font-weight: 600; color: #f0f0f0; letter-spacing: 0.5px; }

        /* 蓝紫渐变下载按钮 */
        .download-btn {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: #fff; 
            padding: 10px 25px; 
            border-radius: 12px;
            font-size: 13px; font-weight: 800; text-decoration: none;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(42, 46, 255, 0.3);
        }
        .download-btn:hover { 
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.5);
        }

        /* 微信引导弹窗：蓝紫配色 */
        #guide-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 18, 0.95); z-index: 1000; backdrop-filter: blur(20px);
            justify-content: center; align-items: center;
        }
        .guide-box {
            width: 85%; max-width: 380px; background: #0c0e24; border: 1px solid var(--purple);
            border-radius: 30px; padding: 45px 25px; text-align: center; position: relative;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.3);
        }
        .guide-arrow { position: absolute; top: -50px; right: 25px; font-size: 45px; color: var(--purple); animation: bounce 1s infinite; }

        .footer { padding: 35px; text-align: center; font-size: 9px; color: rgba(255,255,255,0.25); font-family: monospace; letter-spacing: 5px; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* 手机端深度适配 */
        @media (max-width: 600px) {
            .file-item { 
                flex-direction: column; 
                text-align: center; 
                gap: 20px; 
                padding: 30px 20px; 
            }
            .download-btn { width: 100%; padding: 14px 0; }
            .file-info { flex-direction: column; } /* 手机端图标在文字上方 */
            .file-icon-box { margin-right: 0; margin-bottom: 15px; } /* 修正手机间距 */
            .file-name { font-size: 17px; }
            .header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- 微信环境下才会显示的动作按钮 -->
    <div id="wechat-nav">
        <button class="share-btn" onclick="copyStationLink()">🚀 网址已复制，点此去浏览器打开下载</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>青莲剑客下载站</h1>
            <p>PHANTOM_DEEP // DATA_V6.0</p>
        </div>

        <ul class="file-list" id="fileList">
            <!-- 自动生成内容 -->
        </ul>

        <div class="footer">
            ENCRYPTED_SIGNAL // LINK_VIBRANT_100%
        </div>
    </div>

    <!-- 微信引导 -->
    <div id="guide-overlay" onclick="this.style.display='none'">
        <div class="guide-box">
            <div class="guide-arrow">↗</div>
            <h2 style="color: #fff; font-size: 20px; margin-bottom: 15px;">环境下载受限提示</h2>
            <p style="color: #aaa; font-size: 14px; line-height: 1.8;">
                微信禁止直接下载资源文件。<br><br>
                1. 点击右上角 <strong style="color:var(--purple)">三个点</strong><br>
                2. 选择 <strong style="color:var(--blue)">在浏览器打开</strong><br>
                即可开始极速下载
            </p>
            <button style="margin-top: 25px; background: linear-gradient(90deg, var(--blue), var(--purple)); border: none; padding: 12px 45px; border-radius: 12px; font-weight: bold; color: white; cursor: pointer;">知道了</button>
        </div>
    </div>

    <script>
        const files = [
            { name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" },
        ];

        // 识别微信
        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        if (isWechat) {
            document.getElementById('wechat-nav').style.display = 'block';
        }

        const listContainer = document.getElementById('fileList');

        files.forEach((file, index) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.style.animation = `slideDown 0.4s ease-out ${index * 0.1}s backwards`;
            
            li.innerHTML = `
                <div class="file-info">
                    <div class="file-icon-box"></div>
                    <div class="file-name">${file.name}</div>
                </div>
                <a href="${file.link}" class="download-btn" onclick="handleDownload(event)">Download</a>
            `;
            listContainer.appendChild(li);
        });

        function handleDownload(event) {
            if (isWechat) {
                event.preventDefault();
                document.getElementById('guide-overlay').style.display = 'flex';
            }
        }

        function copyStationLink() {
            const tempInput = document.createElement("input");
            tempInput.value = window.location.href;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("🚀网址已成功复制到剪贴板！\n请粘贴到手机浏览器（如 Safari 或 Chrome）访问。");
        }
    </script>
</body>
</html>
