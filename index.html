<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站</title>
    <style>
        :root {
            --cyan: #00f2ff;
            --purple: #7000ff;
            --lotus-pink: #ff85a1;
            --blade-jade: #00ffa3;
        }

        body {
            margin: 0; padding: 0;
            background: #010208;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 1. 极致粒子画布 */
        #hero-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 30%, #0d1435 0%, #010208 100%);
        }

        /* 2. 顶部 Logo 星旋区域 */
        .header {
            width: 100%;
            padding: calc(60px + env(safe-area-inset-top)) 0 40px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 10;
        }

        .logo-container {
            position: relative;
            width: 120px; height: 120px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }

        .main-sword-svg {
            width: 80px; height: 80px;
            filter: drop-shadow(0 0 15px var(--cyan));
            z-index: 2;
            animation: swordFloat 3s ease-in-out infinite;
        }

        @keyframes swordFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .header h1 {
            font-size: 30px; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(to bottom, #fff, var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0; text-shadow: 0 0 20px rgba(0,242,255,0.3);
        }

        /* 3. 资源列表布局 */
        .main-content {
            width: 100%; max-width: 550px;
            padding: 0 20px 100px;
            box-sizing: border-box;
            z-index: 5;
        }

        .file-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 30px;
            border-radius: 24px;
            padding: 35px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .file-card::before {
            content: ""; position: absolute; inset: -1px; border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, var(--lotus-pink), transparent, var(--cyan), transparent, var(--purple));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            background-size: 200% 200%;
            animation: flowBorder 5s linear infinite;
        }

        @keyframes flowBorder { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

        .file-title-wrapper {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 30px; width: 100%;
        }

        .sword-mini {
            width: 28px; height: 28px; margin-right: 15px;
            filter: drop-shadow(0 0 5px var(--blade-jade));
        }

        .file-name {
            font-size: 19px; font-weight: 700; color: #fff;
            letter-spacing: 1px; text-shadow: 0 0 10px rgba(0,242,255,0.4);
        }

        /* 4. 能量核心按钮 */
        .download-btn {
            width: 85%; height: 56px;
            background: linear-gradient(90deg, var(--purple), var(--cyan));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: #fff;
            font-weight: 900; font-size: 15px; letter-spacing: 3px;
            border: none; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(112, 0, 255, 0.5);
            transition: 0.3s;
        }

        .download-btn::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: btnScan 2s infinite;
        }

        @keyframes btnScan { 0% { left: -100%; } 40%, 100% { left: 100%; } }

        /* 微信遮罩 */
        #wechat-guide {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.96); z-index: 9999; backdrop-filter: blur(15px);
        }

        .footer { padding: 40px; text-align: center; font-size: 10px; color: var(--cyan); opacity: 0.4; letter-spacing: 5px; }
    </style>
</head>
<body>

    <canvas id="hero-canvas"></canvas>

    <header class="header">
        <div class="logo-container" id="logoFrame">
            <!-- SVG 由 JS 注入 -->
        </div>
        <h1>青莲剑客下载站</h1>
    </header>

    <div id="wechat-guide" onclick="this.style.display='none'">
        <div style="position: absolute; top: 20px; right: 30px; color: var(--cyan); text-align: right;">
            <div style="font-size: 50px; animation: bounce 1s infinite;">↗</div>
            <div style="color:#fff; margin-top: 15px; font-weight: bold;">请点击右上角三个点<br>选择“在浏览器打开”</div>
        </div>
    </div>

    <main class="main-content">
        <div id="fileList"></div>
    </main>

    <div class="footer">QUANTUM_BLADE // CORE_SYSTEM</div>

    <script>
        // 1. 核心高密度粒子星旋系统
        const canvas = document.getElementById('hero-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 220; // 极高密度
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(isOrbit) {
                this.reset(isOrbit);
            }
            reset(isOrbit) {
                this.isOrbit = isOrbit;
                if(isOrbit) {
                    this.angle = Math.random() * Math.PI * 2;
                    this.radius = Math.random() * 60 + 60;
                    this.speed = Math.random() * 0.02 + 0.01;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                }
                this.size = Math.random() * 1.5 + 0.5;
                this.color = Math.random() > 0.5 ? '#00f2ff' : '#ff85a1';
            }
            update() {
                if(this.isOrbit) {
                    this.angle += this.speed;
                    this.x = canvas.width/2 + Math.cos(this.angle) * this.radius;
                    this.y = 120 + Math.sin(this.angle) * this.radius; // 对应 logo 位置
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                // 发光点效果
                if(this.isOrbit) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                }
            }
        }

        function createParticles() {
            particles = [];
            // 创建 80 个围绕 Logo 旋转的粒子
            for (let i = 0; i < 80; i++) particles.push(new Particle(true));
            // 创建 140 个背景漂浮粒子
            for (let i = 0; i < 140; i++) particles.push(new Particle(false));
        }

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 80) {
                        ctx.strokeStyle = particles[i].color;
                        ctx.globalAlpha = 1 - (dist / 80);
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0;
            particles.forEach(p => { p.update(); p.draw(); });
            drawLines();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { initCanvas(); createParticles(); });
        initCanvas(); createParticles(); animate();

        // 2. 精致青莲剑 SVG
        const swordSvg = `
            <svg class="main-sword-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="blade" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#00ffa3;" />
                        <stop offset="100%" style="stop-color:#00f2ff;" />
                    </linearGradient>
                </defs>
                <path d="M50 5 L58 35 L54 75 L46 75 L42 35 Z" fill="url(#blade)" />
                <!-- 莲花剑格 -->
                <path d="M50 68 Q58 58 64 68 Q64 78 50 75 Q36 78 36 68 Q42 58 50 68" fill="#ffffff" />
                <path d="M40 68 Q30 65 35 78 Q42 85 50 78" fill="#ff85a1" />
                <path d="M60 68 Q70 65 65 78 Q58 85 50 78" fill="#ff85a1" />
                <!-- 剑柄 -->
                <rect x="47" y="78" width="6" height="15" rx="3" fill="#ffffff" />
            </svg>
        `;
        document.getElementById('logoFrame').innerHTML = swordSvg;

        // 3. 数据渲染 (移除括号内容)
        const files = [
            { name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料包", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy 工具", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" }
        ];

        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        const listEl = document.getElementById('fileList');

        files.forEach(file => {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `
                <div class="file-title-wrapper">
                    <svg class="sword-mini" viewBox="0 0 100 100">${document.querySelector('.main-sword-svg').innerHTML}</svg>
                    <div class="file-name">${file.name}</div>
                </div>
                <a href="${file.link}" class="download-btn" onclick="handleDl(event, this)">DOWNLOAD</a>
            `;
            listEl.appendChild(card);
        });

        function handleDl(e, btn) {
            if (isWechat) {
                e.preventDefault();
                document.getElementById('wechat-guide').style.display = 'block';
            } else {
                btn.innerText = 'ACCESSING...';
                btn.style.boxShadow = '0 0 40px var(--cyan)';
            }
        }
    </script>
</body>
</html>
