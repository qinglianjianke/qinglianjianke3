    <title>青莲剑客下载站 - 剑指核心</title>
    <style>
        :root {
            --cyan: #00f2ff;
            --purple: #7000ff;
            --lotus-pink: #ff85a1; /* 莲花粉 */
            --lotus-white: #ffffff;
            --jade-green: #00ffa3; /* 翡翠青 */
        }

        /* 1. 背景系统 */
        body {
            margin: 0; padding: 0;
            background: #02040f;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a113a 0%, #02040f 100%);
        }

        .grid-3d {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(var(--cyan) 1px, transparent 1px),
                linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
            background-size: 60px 60px;
            perspective: 1000px;
            transform: rotateX(60deg) translateY(-20%) translateZ(-200px);
            mask-image: linear-gradient(to bottom, transparent, rgba(0,0,0,0.5), transparent);
            opacity: 0.25;
            animation: gridMove 10s linear infinite;
        }

        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 60px; } }

        /* 2. 顶部 Logo 与 标题 */
        .header {
            width: 100%;
            padding: calc(40px + env(safe-area-inset-top)) 0 30px;
            text-align: center;
            z-index: 10;
        }

        /* 主 Logo 样式 */
        .main-logo-wrapper {
            margin-bottom: 15px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--cyan));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .header h1 {
            font-size: 28px; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 40%, var(--lotus-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0;
        }

        /* 3. 资源卡片布局 */
        .main-content {
            width: 100%; max-width: 550px;
            padding: 0 20px 100px;
            box-sizing: border-box;
            z-index: 5;
        }

        .file-card {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 35px;
            border-radius: 30px;
            padding: 30px 20px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .file-card::after {
            content: ""; position: absolute; inset: -1px; border-radius: 30px;
            padding: 2px;
            background: linear-gradient(135deg, var(--lotus-pink), transparent, var(--jade-green), transparent, var(--cyan));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            background-size: 200% 200%;
            animation: flowBorder 8s linear infinite;
        }

        @keyframes flowBorder { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

        /* 名字对齐区域 */
        .file-title-wrapper {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px; width: 100%;
        }

        /* 青莲剑 SVG 样式 */
        .sword-icon {
            width: 32px; height: 32px;
            margin-right: 12px;
            filter: drop-shadow(0 0 5px var(--jade-green));
        }

        .file-name {
            font-size: 19px; font-weight: 700; color: #fff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }
