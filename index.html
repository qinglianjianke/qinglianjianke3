<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站 - 官方资源库</title>
    <style>
        :root {
            --primary-blue: #007AFF; /* 苹果蓝 */
            --success-green: #34C759; /* 极光绿 */
            --bg-color: #f5f7fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
        }

        body {
            margin: 0; padding: 20px 10px;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 微信专用：顶部提示条 */
        #wechat-nav {
            display: none; width: 100%; max-width: 600px;
            background: #fff; border: 1px solid #007AFF;
            border-radius: 12px; margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.1);
            animation: slideDown 0.4s ease;
        }
        .share-btn {
            width: 100%; background: none; border: none; padding: 15px;
            color: var(--primary-blue); font-weight: 600; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .share-btn::before { content: "🔗"; margin-right: 8px; }

        /* 主容器：清新磨砂玻璃 */
        .container {
            width: 100%; max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            animation: containerFade 0.6s ease-out;
        }

        @keyframes containerFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header {
            padding: 40px 20px; text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .header h1 {
            margin: 0; font-size: 24px; font-weight: 700;
            color: var(--text-main); letter-spacing: -0.5px;
        }
        .header p { margin: 10px 0 0; font-size: 13px; color: var(--text-sub); }

        .file-list { padding: 10px; list-style: none; margin: 0; }
        .file-item {
            padding: 20px; margin: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px; border: 1px solid rgba(0,0,0,0.02);
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        .file-item:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
        }

        .file-info { display: flex; align-items: center; }
        .file-icon {
            width: 40px; height: 40px; background: #f0f2f5;
            border-radius: 10px; margin-right: 15px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .file-name { font-size: 16px; font-weight: 500; color: var(--text-main); }

        /* 专业蓝色按钮 */
        .download-btn {
            background: linear-gradient(180deg, #0084ff 0%, #007aff 100%);
            color: #fff; padding: 10px 24px; border-radius: 50px;
            font-size: 13px; font-weight: 600; text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.2);
            transition: 0.2s;
        }
        .download-btn:hover { transform: scale(1.05); box-shadow: 0 6px 15px rgba(0, 122, 255, 0.3); }
        .download-btn:active { transform: scale(0.98); }

        /* 微信引导弹窗：商务蓝风格 */
        #guide-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 100; backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
        }
        .guide-box {
            width: 80%; max-width: 320px; background: #fff;
            border-radius: 20px; padding: 30px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .guide-box h2 { font-size: 18px; margin-top: 0; color: var(--primary-blue); }
        .guide-box p { font-size: 14px; color: #666; line-height: 1.6; }

        .footer { padding: 30px; text-align: center; font-size: 12px; color: var(--text-sub); }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .file-item { flex-direction: column; text-align: center; gap: 15px; }
            .download-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 微信内可见：复制站点网址按钮 -->
    <div id="wechat-nav">
        <button class="share-btn" onclick="copyStationLink()">点击复制下载站网址，去浏览器打开</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>青莲剑客下载站</h1>
            <p>Official Resource Repository // Stable V4.5</p>
        </div>

        <ul class="file-list" id="fileList">
            <!-- 动态生成 -->
        </ul>

        <div class="footer">
            Secure Connection // High Speed Server
        </div>
    </div>

    <!-- 微信引导 -->
    <div id="guide-overlay" onclick="this.style.display='none'">
        <div class="guide-box">
            <h2>微信无法直接下载</h2>
            <p>
                1. 点击右上角 <strong>“三个点”</strong><br>
                2. 选择 <strong>“在浏览器打开”</strong><br>
                即可开始安全下载
            </p>
            <button style="background: var(--primary-blue); border: none; color: #fff; padding: 10px 30px; border-radius: 10px; margin-top: 10px; font-weight: 600;">确定</button>
        </div>
    </div>

    <script>
        const files = [
            { name: "LCD12864手册带字库", icon: "📄", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", icon: "⚙️", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料", icon: "📦", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy", icon: "🚀", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" },
        ];

        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        if (isWechat) {
            document.getElementById('wechat-nav').style.display = 'block';
        }

        const listContainer = document.getElementById('fileList');

        files.forEach((file, index) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.style.animation = `slideDown 0.4s ease forwards ${index * 0.1}s`;
            li.style.opacity = "0";
            
            li.innerHTML = `
                <div class="file-info">
                    <div class="file-icon">${file.icon}</div>
                    <div class="file-name">${file.name}</div>
                </div>
                <a href="${file.link}" class="download-btn" onclick="handleDownload(event)">下载</a>
            `;
            listContainer.appendChild(li);
        });

        function handleDownload(event) {
            if (isWechat) {
                event.preventDefault();
                document.getElementById('guide-overlay').style.display = 'flex';
            }
        }

        function copyStationLink() {
            const tempInput = document.createElement("input");
            tempInput.value = window.location.href;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("✅ 下载站网址已复制！\n请打开手机浏览器（如 Safari 或 Chrome）粘贴访问下载。");
        }
    </script>
</body>
</html>
