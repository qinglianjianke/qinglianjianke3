<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站</title>
    <style>
        :root {
            --cyan: #00f2ff;
            --purple: #7000ff;
            --lotus-pink: #ff85a1;
            --blade-jade: #00ffa3;
        }

        body {
            margin: 0; padding: 0;
            background: #01020a;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 1. 极致粒子画布 - 只渲染发光的点，绝无连线 */
        #starfield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 30%, #0d1233 0%, #01020a 100%);
        }

        /* 2. 顶部 Logo 星旋 */
        .header {
            width: 100%;
            padding: calc(50px + env(safe-area-inset-top)) 0 30px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 10;
        }

        .logo-frame {
            position: relative;
            width: 130px; height: 130px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px;
        }

        .main-sword {
            width: 70px; height: 70px;
            filter: drop-shadow(0 0 15px var(--cyan));
            z-index: 5;
            animation: swordFloat 4s ease-in-out infinite;
        }

        @keyframes swordFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .header h1 {
            font-size: 26px; font-weight: 900; letter-spacing: 5px;
            background: linear-gradient(to bottom, #fff, var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0;
        }

        /* 3. 机能卡片列表 */
        .main-content {
            width: 100%; max-width: 500px;
            padding: 0 18px 80px;
            box-sizing: border-box;
            z-index: 5;
        }

        .file-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 25px;
            border-radius: 22px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center;
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
        }

        /* 卡片边缘呼吸流光 */
        .file-card::after {
            content: ""; position: absolute; inset: 0;
            border-radius: 22px; padding: 1px;
            background: linear-gradient(135deg, var(--lotus-pink), transparent, var(--cyan), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0.4;
        }

        .title-group {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px; width: 100%;
        }

        .mini-sword {
            width: 26px; height: 26px; margin-right: 12px;
            filter: drop-shadow(0 0 5px var(--blade-jade));
        }

        .file-name {
            font-size: 18px; font-weight: 700; color: #fff;
            letter-spacing: 0.5px;
        }

        /* 4. 极速按钮 */
        .download-btn {
            width: 85%; height: 52px;
            background: linear-gradient(90deg, var(--purple), var(--cyan));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: #fff;
            font-weight: 900; font-size: 14px; letter-spacing: 2px;
            border: none; position: relative; overflow: hidden;
            box-shadow: 0 8px 20px rgba(112, 0, 255, 0.3);
            transition: 0.3s;
        }
        .download-btn:active { transform: scale(0.95); opacity: 0.8; }

        /* 按钮扫光 */
        .download-btn::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: btnScan 3s infinite;
        }
        @keyframes btnScan { 0% { left: -100%; } 40%, 100% { left: 100%; } }

        /* 微信遮罩层 */
        #wechat-guide {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 9999; backdrop-filter: blur(10px);
        }

        .footer { padding: 30px; text-align: center; font-size: 9px; color: var(--cyan); opacity: 0.3; letter-spacing: 5px; }

    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <header class="header">
        <div class="logo-frame" id="logoFrame">
            <!-- SVG 由 JS 注入 -->
        </div>
        <h1>青莲剑客下载站</h1>
    </header>

    <div id="wechat-guide" onclick="this.style.display='none'">
        <div style="position: absolute; top: 20px; right: 30px; color: var(--cyan); text-align: right;">
            <div style="font-size: 40px; animation: bounce 1s infinite;">↗</div>
            <div style="color:#fff; margin-top: 15px;">请点击右上角三个点<br>选择“在浏览器打开”</div>
        </div>
    </div>

    <main class="main-content">
        <div id="fileList"></div>
    </main>

    <div class="footer">STATION_V7.2 // QUANTUM_PARTICLE_CORE</div>

    <script>
        // 1. 极致流畅粒子引擎 - 解决卡顿与线条问题
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 200; // 高密度粒子感

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(isOrbit) {
                this.isOrbit = isOrbit;
                this.reset();
            }
            reset() {
                if(this.isOrbit) {
                    this.angle = Math.random() * Math.PI * 2;
                    this.radius = Math.random() * 50 + 55;
                    this.speed = Math.random() * 0.015 + 0.005;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                }
                this.size = Math.random() * 2 + 0.5;
                this.color = Math.random() > 0.4 ? '#00f2ff' : '#ff85a1';
                this.alpha = Math.random();
                this.flicker = Math.random() * 0.02 + 0.01;
            }
            update() {
                if(this.isOrbit) {
                    this.angle += this.speed;
                    this.x = canvas.width/2 + Math.cos(this.angle) * this.radius;
                    this.y = 115 + Math.sin(this.angle) * this.radius; // 这里的115对应logo中心
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
                // 呼吸闪烁感
                this.alpha += this.flicker;
                if(this.alpha > 1 || this.alpha < 0.2) this.flicker *= -1;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                // 添加发光晕影
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function create() {
            particles = [];
            for (let i = 0; i < 70; i++) particles.push(new Particle(true)); // 旋转环
            for (let i = 0; i < 130; i++) particles.push(new Particle(false)); // 背景流星
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => { initCanvas(); create(); });
        initCanvas(); create(); loop();

        // 2. 幻彩青莲剑 SVG
        const swordSvgHtml = `
            <svg class="main-sword" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="blade" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#00ffa3;" />
                        <stop offset="100%" style="stop-color:#00f2ff;" />
                    </linearGradient>
                </defs>
                <path d="M50 5 L57 32 L53 75 L47 75 L43 32 Z" fill="url(#blade)" />
                <path d="M50 68 Q58 58 64 68 Q64 78 50 75 Q36 78 36 68 Q42 58 50 68" fill="#ffffff" />
                <path d="M40 68 Q30 65 35 78 Q42 85 50 78" fill="#ff85a1" />
                <stop offset="100%" style="stop-color:#ff85a1;" />
                <path d="M60 68 Q70 65 65 78 Q58 85 50 78" fill="#ff85a1" />
                <rect x="47" y="78" width="6" height="15" rx="3" fill="#ffffff" />
            </svg>
        `;
        document.getElementById('logoFrame').innerHTML = swordSvgHtml;

        // 3. 数据渲染 (移除括注)
        const files = [
            { name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料包", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy 工具", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" }
        ];

        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        const listEl = document.getElementById('fileList');

        files.forEach(file => {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `
                <div class="title-group">
                    <svg class="mini-sword" viewBox="0 0 100 100">${document.querySelector('.main-sword').innerHTML}</svg>
                    <div class="file-name">${file.name}</div>
                </div>
                <a href="${file.link}" class="download-btn" onclick="handleDl(event, this)">DOWNLOAD</a>
            `;
            listEl.appendChild(card);
        });

        function handleDl(e, btn) {
            if (isWechat) {
                e.preventDefault();
                document.getElementById('wechat-guide').style.display = 'block';
            } else {
                btn.innerText = 'SYNCING...';
                btn.style.filter = 'hue-rotate(45deg)';
            }
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </script>
</body>
</html>
