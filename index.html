<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站 - 核心资源</title>
    <style>
        :root {
            --cyan: #00f2ff;
            --purple: #7000ff;
            --pink: #ff00d0;
            --bg-dark: #020410;
        }

        /* 动态彩色背景 */
        body {
            margin: 0; padding: 20px 15px;
            background: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 50%, #101535 0%, #020410 100%);
        }

        /* 动态流光线条背景 */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 208, 0.15) 0%, transparent 40%);
            z-index: -1; animation: bgPulse 8s infinite alternate;
        }
        @keyframes bgPulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* 微信专供：单按钮导航 */
        #wechat-nav {
            display: none; width: 100%; max-width: 600px;
            margin-bottom: 20px;
            animation: slideDown 0.5s ease;
        }
        .share-station-btn {
            width: 100%; background: linear-gradient(90deg, #ff00d0, #7000ff);
            border: none; color: white; padding: 15px; border-radius: 12px;
            font-weight: bold; font-size: 14px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 208, 0.4);
            letter-spacing: 1px;
        }

        /* 全息容器 */
        .container {
            width: 100%; max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            animation: containerIn 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 炫彩头部 */
        .header {
            padding: 40px 20px; text-align: center;
            background: linear-gradient(135deg, rgba(112,0,255,0.3), rgba(0,242,255,0.3));
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .header h1 {
            margin: 0; font-size: 26px; font-weight: 800;
            background: linear-gradient(to right, #00f2ff, #ff00d0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,242,255,0.5));
        }
        .header p { margin: 10px 0 0; font-size: 10px; font-family: monospace; color: var(--cyan); letter-spacing: 3px; }

        /* 文件卡片 */
        .file-list { padding: 15px; list-style: none; margin: 0; }
        .file-item {
            background: rgba(255,255,255,0.03); margin-bottom: 15px;
            padding: 20px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s; position: relative;
        }
        .file-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-5px);
            border-color: var(--cyan);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.2);
        }

        .file-name { font-size: 15px; font-weight: 600; color: #eee; }
        .file-name::before { content: "❖"; color: var(--cyan); margin-right: 12px; font-size: 18px; }

        /* 霓虹按钮 */
        .download-btn {
            background: transparent; border: 1px solid var(--cyan);
            color: var(--cyan); padding: 10px 20px; border-radius: 50px;
            font-size: 12px; font-weight: bold; text-decoration: none;
            transition: 0.3s; text-transform: uppercase;
        }
        .download-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }

        /* 微信引导弹窗 */
        #guide-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; backdrop-filter: blur(10px);
            flex-direction: column; align-items: center; padding-top: 100px;
        }
        .guide-box {
            width: 85%; background: #0a0b25; border: 1px solid var(--pink);
            border-radius: 25px; padding: 30px; text-align: center; position: relative;
        }
        .guide-arrow { position: absolute; top: -60px; right: 20px; font-size: 50px; color: var(--pink); animation: bounce 1s infinite; }

        .footer { padding: 30px; text-align: center; font-size: 10px; color: rgba(255,255,255,0.2); font-family: monospace; }

        /* 动画定义 */
        @keyframes containerIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* 手机适配 */
        @media (max-width: 480px) {
            .file-item { flex-direction: column; text-align: center; gap: 15px; }
            .download-btn { width: 100%; padding: 12px 0; }
        }
    </style>
</head>
<body class="">

    <!-- 微信专供：置顶功能按钮 -->
    <div id="wechat-nav">
        <button class="share-station-btn" onclick="copyStationLink()">🚀 点击复制站点网址，去浏览器打开下载</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>青莲剑客下载站</h1>
            <p>HIGH_SPEED_V3.5 // NEON_CORE</p>
        </div>

        <ul class="file-list" id="fileList">
            <!-- 动态生成 -->
        </ul>

        <div class="footer">
            SIGNAL_STRENGTH: EXCELLENT // SECURITY_ENCRYPTED
        </div>
    </div>

    <!-- 微信点击下载引导 -->
    <div id="guide-overlay" onclick="this.style.display='none'">
        <div class="guide-box">
            <div class="guide-arrow">↗</div>
            <h2 style="color: var(--pink);">检测到微信环境</h2>
            <p style="color: #aaa; font-size: 14px; line-height: 1.8;">
                微信限制了文件直接下载。<br>
                1. 点击右上角 <strong style="color:#fff">三个点</strong><br>
                2. 选择 <strong style="color:var(--cyan)">在浏览器打开</strong> 即可享受极速下载。
            </p>
            <div style="margin-top: 20px; color: var(--cyan); font-size: 12px;">或者点击顶部的复制按钮去粘贴</div>
        </div>
    </div>

    <script>
        const files = [
            { name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" },
        ];

        // 核心逻辑：环境识别
        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        if (isWechat) {
            document.body.classList.add('is-wechat');
            document.getElementById('wechat-nav').style.display = 'block';
        }

        const listContainer = document.getElementById('fileList');

        files.forEach((file, index) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.style.animation = `slideDown 0.5s ease forwards ${index * 0.1}s`;
            li.style.opacity = "0";
            
            li.innerHTML = `
                <div class="file-name">${file.name}</div>
                <a href="${file.link}" class="download-btn" onclick="handleDownload(event)">Download</a>
            `;
            listContainer.appendChild(li);
        });

        // 微信环境下点击下载
        function handleDownload(event) {
            if (isWechat) {
                event.preventDefault();
                document.getElementById('guide-overlay').style.display = 'flex';
            }
        }

        // 核心修改：复制当前下载站网址
        function copyStationLink() {
            const currentUrl = window.location.href;
            const tempInput = document.createElement("input");
            tempInput.value = currentUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("🚀 站点网址已复制成功！\n请打开手机浏览器（如 Safari 或 Chrome）粘贴访问。");
        }
    </script>
</body>
</html>
