<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="mine.jpg" type="image/jpeg">
    <title>青莲剑客下载站</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #7000ff;
            --neon-pink: #ff00d0;
            --bg-dark: #020410;
        }

        /* 1. 动态全景背景：离子星云系统 */
        body {
            margin: 0; padding: 0;
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 填补空洞的动态层 */
        .plasma-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.15) 0%, transparent 50%);
            filter: blur(80px);
            animation: plasmaMove 20s infinite alternate;
        }

        .grid-layers {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.2;
            background-image: 
                linear-gradient(var(--neon-blue) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-blue) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 1000px;
            transform: rotateX(60deg) translateY(-20%);
            mask-image: linear-gradient(to bottom, transparent, black, transparent);
        }

        /* 2. 悬浮导航栏：流光描边 */
        .nav-bar {
            position: fixed; top: 0; left: 0; width: 100%; padding-top: env(safe-area-inset-top);
            z-index: 1000; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }
        .nav-content { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .nav-title { 
            font-size: 20px; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 3. 机能卡片：量子悬浮质感 */
        .main-content {
            padding: calc(100px + env(safe-area-inset-top)) 20px 50px;
            width: 100%; max-width: 500px; box-sizing: border-box;
        }

        .file-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 30px;
            border-radius: 24px;
            padding: 35px 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: cardEnter 0.6s backwards;
        }

        /* 卡片扫光特效 */
        .file-card::before {
            content: ""; position: absolute; inset: -1px; border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, var(--neon-blue), transparent, var(--neon-purple), transparent, var(--neon-pink));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            background-size: 300% 300%;
            animation: borderGlow 4s linear infinite;
        }

        .file-name {
            font-size: 19px; font-weight: 700; color: #fff;
            margin-bottom: 25px; text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* 4. 极速按钮：等离子发光 */
        .download-btn {
            width: 85%; height: 55px;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: #fff;
            font-weight: 800; font-size: 15px; letter-spacing: 2px;
            border: none; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
            transition: 0.3s;
        }

        .download-btn:active { transform: scale(0.92); filter: brightness(1.2); }

        .btn-glitch {
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: scanLine 3s infinite;
        }

        /* 5. 动画系统 */
        @keyframes plasmaMove {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes scanLine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 微信提示优化 */
        #wechat-guide {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; backdrop-filter: blur(10px);
        }

        /* 手机端底部安全距 */
        .footer-pad { height: env(safe-area-inset-bottom); padding: 20px; text-align: center; font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- 动态层：填补背景空洞 -->
    <div class="plasma-bg"></div>
    <div class="grid-layers"></div>

    <header class="nav-bar">
        <div class="nav-content">
            <div class="nav-title">青莲剑客下载站</div>
            <div id="wechat-btn" style="font-size: 12px; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 4px 8px; border-radius: 6px; display:none;" onclick="copyLink()">分享站点</div>
        </div>
    </header>

    <div id="wechat-guide" onclick="this.style.display='none'">
        <div style="position: absolute; top: 20px; right: 30px; text-align: right; color: var(--neon-blue);">
            <div style="font-size: 40px; animation: bounce 1s infinite;">↗</div>
            <div style="color:#fff; margin-top: 10px;">请点击右上角三个点<br>选择“在浏览器打开”</div>
        </div>
    </div>

    <main class="main-content">
        <!-- 动态生成的列表 -->
        <div id="fileList"></div>
    </main>

    <div class="footer-pad">SECURED // NEON_CORE V6.0</div>

    <script>
        const files = [
            { name: "LCD12864手册带字库", link: "./LCD12864手册带字库.pdf" },
            { name: "Visual C++6.0 (极速)", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/VC6.0/Visual.C++6.0.zip" },
            { name: "STM32入门资料包 (1.5G)", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/STM32/STM32.zip" },
            { name: "OpenSpeedy 工具", link: "https://myproxy.060829.xyz/https://github.com/qinglianjianke/qinglianjianke3/releases/download/OpenSpeedy/OpenSpeedy.zip" }
        ];

        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        if (isWechat) document.getElementById('wechat-btn').style.display = 'block';

        const container = document.getElementById('fileList');

        files.forEach((file, index) => {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.style.animationDelay = (index * 0.15) + 's';
            
            card.innerHTML = `
                <div class="file-name">${file.name}</div>
                <a href="${file.link}" class="download-btn" onclick="handleDl(event, this)">
                    <div class="btn-glitch"></div>
                    DOWNLOAD
                </a>
            `;
            container.appendChild(card);
        });

        function handleDl(e, btn) {
            if (isWechat) {
                e.preventDefault();
                document.getElementById('wechat-guide').style.display = 'block';
                return;
            }
            btn.style.filter = 'hue-rotate(90deg)';
            btn.innerText = 'FETCHING...';
        }

        function copyLink() {
            const t = document.createElement("input");
            t.value = window.location.href;
            document.body.appendChild(t);
            t.select();
            document.execCommand("copy");
            document.body.removeChild(t);
            alert("站点网址已复制，请去浏览器粘贴。");
        }
    </script>
</body>
</html>
